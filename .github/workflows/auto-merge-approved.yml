name: Acceptance-gated native auto-merge

on:
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  enable-automerge:
    name: enable-automerge
    if: >-
      github.event.action == 'synchronize' ||
      (github.event.action == 'labeled' && github.event.label.name == 'merge-verified')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_ACTION: ${{ github.event.action }}
      REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Prevent stale auto-merge authorization after PR updates
        if: env.EVENT_ACTION == 'synchronize'
        shell: bash
        run: |
          gh pr merge "$PR_NUMBER" -R "$REPO" --disable-auto || true
          gh api --method DELETE "repos/$REPO/issues/$PR_NUMBER/labels/merge-verified" >/dev/null 2>&1 || true
          echo 'On new PR SHA, old merge authorization was invalidated; fresh checks and label are required.'

      - name: Enable native auto-merge only after all checks have settled
        if: env.EVENT_ACTION == 'labeled'
        shell: bash
        run: |
          set -euo pipefail
          info=$(gh pr view "$PR_NUMBER" -R "$REPO" --json headRefOid,isDraft,mergeable,mergeStateStatus,statusCheckRollup)
          INFO="$info" python3 - <<'PY'
          import json,os,sys
          p=json.loads(os.environ['INFO'])
          if p.get('isDraft') or p.get('mergeable') != 'MERGEABLE' or p.get('headRefOid') != os.environ['REQUEST_HEAD']:
              raise SystemExit('REFUSE auto-merge: PR draft/conflict/SHA drift')
          roll=p.get('statusCheckRollup') or []
          required={'repository-admission','scientific-admission'}
          present={}
          for c in roll:
              name=c.get('name') or c.get('context') or ''
              if name == 'enable-automerge':
                  continue  # Control workflow cannot wait for itself; exclude previous control-only runs too.
              if c.get('status') is not None:
                  ok = c.get('status')=='COMPLETED' and c.get('conclusion')=='SUCCESS'
              else:
                  ok = c.get('state')=='SUCCESS'  # GitHub commit-status contexts, including ubuntu-docker-full
              if name in required and ok:
                  present[name]=True
              if name not in required and not ok:
                  raise SystemExit(f'REFUSE auto-merge: applicable check not successful: {name} {c}')
          if set(present)!=required:
              raise SystemExit(f'REFUSE auto-merge: missing required passing checks: {required-set(present)}')
          print('Existing applicable checks passed; branch rules still enforce latest required checks.')
          PY
          current_head=$(gh pr view "$PR_NUMBER" -R "$REPO" --json headRefOid --jq .headRefOid)
          test "$current_head" = "$REQUEST_HEAD"
          gh pr merge "$PR_NUMBER" -R "$REPO" --auto --squash --match-head-commit "$REQUEST_HEAD"
