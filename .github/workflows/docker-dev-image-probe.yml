name: OpenFOAM v2606 build and M1A scalar verification
on:
  pull_request:
    paths:
      - '.github/workflows/docker-dev-image-probe.yml'
      - 'src/**'
      - 'tests/**'
      - 'cases/**'
      - 'scripts/**'
      - 'docker/**'
      - 'docs/docker-image-audit.md'
      - 'AGENTS.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-jammy-dev:
    name: Official OpenFOAM APT on Ubuntu 22.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build official-package image and compile both executables
        shell: bash
        run: bash scripts/probe_official_jammy.sh
      - name: Run M1A closed-domain analytic diffusion regression
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --entrypoint /bin/bash \
            cteasfoam/official-v2606-dev:jammy-m0 \
            -c 'bash /workspace/tests/m1a/run_diffusion_regression.sh'
      - name: Run M1A periodic advection and grid refinement regression
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --entrypoint /bin/bash \
            cteasfoam/official-v2606-dev:jammy-m0 \
            -c 'bash /workspace/tests/m1a/run_advection_regression.sh'
      - name: Run real two-rank OpenFOAM PDE and reconstruction regression
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --entrypoint /bin/bash \
            cteasfoam/official-v2606-dev:jammy-m0 \
            -c 'bash /workspace/tests/m1a/run_parallel_diffusion_regression.sh'
      - name: Run M1B-0 transient Couette momentum analytic regression
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --entrypoint /bin/bash \
            cteasfoam/official-v2606-dev:jammy-m0 \
            -c 'bash /workspace/tests/m1b/run_couette_regression.sh'
      - name: Run M1B-1a pressure-corrected Taylor-Green analytic regression
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --entrypoint /bin/bash \
            cteasfoam/official-v2606-dev:jammy-m0 \
            -c 'bash /workspace/tests/m1b1/run_tgv_regression.sh'
      - name: Run M1B-1b two-rank pressure-velocity serial equivalence
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --entrypoint /bin/bash \
            cteasfoam/official-v2606-dev:jammy-m0 \
            -c 'bash /workspace/tests/m1b1/run_piso_mpi.sh'
      - name: Run M1B-1c driven no-slip Poiseuille analytic regression
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --entrypoint /bin/bash \
            cteasfoam/official-v2606-dev:jammy-m0 \
            -c 'bash /workspace/tests/m1b1/run_poiseuille_regression.sh'
      - name: Run M1B-1d genuine 3D ABC Beltrami nonlinear analytic regression
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --entrypoint /bin/bash \
            cteasfoam/official-v2606-dev:jammy-m0 \
            -c 'bash /workspace/tests/m1b1/run_abc_regression.sh'
      - name: Run M1B-1d true 3D ABC two-axis MPI equivalence
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --entrypoint /bin/bash \
            cteasfoam/official-v2606-dev:jammy-m0 \
            -c 'bash /workspace/tests/m1b1/run_abc_mpi.sh'
      - name: Run M1B-1e true fixed-pressure open inlet outlet regression
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --entrypoint /bin/bash \
            cteasfoam/official-v2606-dev:jammy-m0 \
            -c 'bash /workspace/tests/m1b1/run_open_pressure_regression.sh'
      - name: Run M1B-1f actual 3D nonorthogonal ABC and centroid acceptance
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --entrypoint /bin/bash \
            cteasfoam/official-v2606-dev:jammy-m0 \
            -c 'bash /workspace/tests/m1b1/run_warped_abc_regression.sh'
      - name: Run M1B-1f real nonorthogonal pressure inner-iteration acceptance
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --entrypoint /bin/bash \
            cteasfoam/official-v2606-dev:jammy-m0 \
            -c 'bash /workspace/tests/m1b1/run_nonorth_pressure_regression.sh'
      - name: Run M1B-1f warped 3D x/z MPI and nonorth pressure acceptance
        shell: bash
        run: |
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --entrypoint /bin/bash \
            cteasfoam/official-v2606-dev:jammy-m0 \
            -c 'bash /workspace/tests/m1b1/run_warped_abc_mpi.sh'
      - name: Preserve build/compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-v2606-jammy-dev-probe
          path: reports/official-jammy-*/
          if-no-files-found: warn
